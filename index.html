<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Car Wash Empire – Prototype v0.1</title>
<style>
:root{--blue:#1597e5;--deep:#12304a;--yellow:#ffc62e;--green:#35c96b;--bg:#bfe8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#aee1ff,#eaf8ff);color:var(--deep);overflow:hidden;touch-action:none}
#game{height:100vh;max-width:620px;margin:auto;display:flex;flex-direction:column}
.top{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:21px;line-height:.9;color:#fff;text-shadow:0 2px 0 #176aa1,0 4px 8px #77b7d8}
.cash{background:#fff;border:3px solid #1b79b5;border-radius:18px;padding:8px 13px;font-weight:900;box-shadow:0 5px 0 #1b79b5}
.station{margin:6px 12px 0;flex:1;min-height:0;background:linear-gradient(#e7f8ff 0 22%,#78c96d 22% 42%,#666 42% 100%);border:4px solid #176aa1;border-radius:28px;position:relative;overflow:hidden;box-shadow:0 9px 0 #176aa1}
.sign{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#167ec0;color:#fff;font-weight:1000;font-size:24px;padding:8px 22px;border-radius:14px;border:4px solid #0d5d91;white-space:nowrap}
.cloud{position:absolute;width:110px;height:38px;background:#fff;border-radius:30px;opacity:.8;top:22px}.c1{left:8px}.c2{right:10px;top:50px}
.lane{position:absolute;left:7%;right:7%;bottom:12%;height:44%;background:#4d5158;border-radius:20px;border:5px solid #35383d}
.yellow{position:absolute;left:0;right:0;top:7%;height:10%;background:repeating-linear-gradient(90deg,#ffd32e 0 32px,transparent 32px 56px)}
.car{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(0deg);width:min(76%,360px);filter:drop-shadow(0 12px 5px #2228);transition:.25s}
.carbody{fill:#168ee0;stroke:#075c96;stroke-width:5}.glass{fill:#1c3545;stroke:#0d2534;stroke-width:4}.wheel{fill:#20252a;stroke:#0d1114;stroke-width:4}.rim{fill:#d8e3e8;stroke:#87969e;stroke-width:3}
.dirt{opacity:1;transition:opacity .2s}.dirt circle,.dirt path{fill:#6d472e}.foam{opacity:0;transition:opacity .2s}.foam circle{fill:#fff;stroke:#d9f4ff;stroke-width:3}
.progressWrap{position:absolute;left:10%;right:10%;bottom:5%;height:22px;background:#24313b;border-radius:14px;border:3px solid #fff;overflow:hidden}
#progress{height:100%;width:0;background:linear-gradient(90deg,#35c96b,#caff57);transition:width .08s}
.stage{position:absolute;left:10px;top:10px;background:#fff;border:3px solid #176aa1;border-radius:13px;padding:7px 10px;font-weight:900}
.controls{padding:12px 14px 18px}
.instruction{text-align:center;font-weight:800;margin:2px 0 8px}
.btnrow{display:flex;gap:9px}
button{border:0;font:inherit;font-weight:1000;cursor:pointer}
.action{flex:1;padding:15px 8px;border-radius:18px;background:var(--blue);color:#fff;border:4px solid #0d679d;box-shadow:0 6px 0 #0d679d;font-size:17px}
.action:active{transform:translateY(4px);box-shadow:0 2px 0 #0d679d}
.action.secondary{background:#ffc62e;color:#513700;border-color:#d79c00;box-shadow:0 6px 0 #d79c00}
.upgrade{margin-top:10px;background:#fff;border:3px solid #176aa1;border-radius:18px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 0 #176aa1}
.small{font-size:12px;opacity:.7}.lvl{font-weight:1000}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:25px}
.card{background:#fff;border:5px solid #176aa1;border-radius:28px;padding:25px;text-align:center;max-width:360px;box-shadow:0 12px 0 #0d527c}
.card h1{margin:0 0 8px;color:#0e78b7}.reward{font-size:34px;font-weight:1000;color:#1f9b4c;margin:10px}
.stars{font-size:30px;letter-spacing:5px}
</style>
<style>
/* v0.5 sequential tools */
.toolBtn.locked{opacity:.38;filter:grayscale(1);box-shadow:none;position:relative}
.toolBtn.locked:after{content:"🔒";position:absolute;right:4px;top:2px;font-size:11px}
.toolBtn.active{background:#ffc72c}
.stageStatus{font-size:11px;font-weight:900;margin-top:4px;opacity:.75}
</style>

<style>
/* v0.4 - visible dirt cleaning */
.cleanLayer{position:absolute;left:50%;top:50%;width:min(78%,370px);height:auto;aspect-ratio:500/260;transform:translate(-50%,-50%);pointer-events:none;z-index:9}
.dirtSpot{position:absolute;border-radius:50%;background:#704a31;box-shadow:inset 2px 2px 3px #4c301f;transition:opacity .18s,transform .18s}
.dirtSpot.cleaning{opacity:.25;transform:scale(.65)}
.toolLabel{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);background:#fff;border:3px solid #176fa7;border-radius:14px;padding:7px 12px;font-weight:1000;z-index:12;box-shadow:0 3px 0 #176fa7}
.toolRow{display:flex;gap:7px;margin-top:8px}
.toolBtn{flex:1;background:#fff;border:3px solid #176fa7;border-radius:14px;padding:9px 4px;font-weight:1000;box-shadow:0 4px 0 #176fa7}
.toolBtn.active{background:#ffc72c;border-color:#d29b00;box-shadow:0 4px 0 #d29b00}
</style>

<style>
/* Car Wash Empire v0.5.1 */
.cleanFX{position:absolute;inset:0;pointer-events:none;z-index:8}
.soapBubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bdefff 65%,#8dddf5);border:2px solid #fff;box-shadow:0 2px 5px #14749a55;animation:bubble .7s ease-out forwards}
@keyframes bubble{0%{opacity:.95;transform:scale(.5)}100%{opacity:0;transform:translateY(-30px) scale(1.35)}}
.cleanPulse{position:absolute;border-radius:50%;border:4px solid #fff;animation:pulse .35s ease-out forwards}
@keyframes pulse{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.8)}}
.stageHint{position:absolute;left:50%;top:7%;transform:translateX(-50%);background:#ffffffdd;border:3px solid #176fa7;border-radius:14px;padding:7px 12px;font-weight:1000;z-index:10;white-space:nowrap}
.combo{position:absolute;right:10px;top:10px;background:#ffc72c;border:3px solid #d29b00;border-radius:13px;padding:7px 10px;font-weight:1000;z-index:10;opacity:0;transform:scale(.8);transition:.15s}
.combo.show{opacity:1;transform:scale(1)}
</style>

<style>
/* v0.2 polish */
body{background:linear-gradient(#a9e0ff,#eefaff)}
.station{box-shadow:0 9px 0 #176aa1}
.car{filter:drop-shadow(0 13px 6px #1118);transition:transform .2s}
.car.shake{animation:shake .22s linear 2}
@keyframes shake{25%{transform:translate(-48%,-50%) rotate(-1deg)}75%{transform:translate(-52%,-50%) rotate(1deg)}}
.waterFX{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:7}
.waterFX:before,.waterFX:after{content:"💦";position:absolute;font-size:28px;animation:splash .45s ease-out}
.waterFX:before{left:28%;top:42%}.waterFX:after{right:28%;top:48%}
@keyframes splash{0%{opacity:0;transform:scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-35px) scale(1.25)}}
</style>

</head>
<body>
<div id="game">
  <div class="top">
    <div class="logo">CAR WASH<br><span style="color:#ffc62e">EMPIRE</span><small style="display:block;font-size:9px;color:#fff;opacity:.75;margin-top:4px">PROTOTYPE v0.5.1</small></div>
    <div class="cash">💵 $<span id="cash">100</span></div>
  </div>

  <div class="station" id="station"><div class="stageHint" id="stageHint">DRA ÖVER BILEN</div><div class="combo" id="combo">🔥 COMBO x1</div><div class="cleanFX" id="cleanFX"></div><div class="cleanLayer" id="cleanLayer"></div><div class="toolLabel" id="toolLabel">🚿 HÖGTRYCK</div>
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <div class="sign">🚗 CAR WASH</div>
    <div class="stage" id="stage">1 / 4 · WASH</div>
    <div class="lane"><div class="yellow"></div>
      <svg class="car" id="car" viewBox="0 0 500 260" aria-label="blue compact car">
        <ellipse cx="250" cy="220" rx="175" ry="17" fill="#111" opacity=".25"/>
        <path class="carbody" d="M82 174 L103 116 Q112 92 148 86 L187 57 Q201 46 225 46 L318 46 Q345 47 360 62 L394 91 Q419 99 426 126 L437 174 Q442 193 421 199 L75 199 Q57 194 64 178Z"/>
        <path class="glass" d="M169 89 L199 62 Q207 56 224 56 L258 56 L258 91Z"/>
        <path class="glass" d="M270 56 L315 57 Q330 58 342 69 L366 91 L270 91Z"/>
        <path class="carbody" d="M104 121 Q126 103 153 101 L392 101 Q409 105 417 121 L422 137 L96 137Z"/>
        <circle class="wheel" cx="145" cy="196" r="38"/><circle class="rim" cx="145" cy="196" r="18"/>
        <circle class="wheel" cx="367" cy="196" r="38"/><circle class="rim" cx="367" cy="196" r="18"/>
        <path d="M79 146 L109 145" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
        <path d="M408 146 L426 148" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
        <g class="dirt" id="dirt">
          <circle cx="120" cy="126" r="15"/><circle cx="180" cy="151" r="11"/><circle cx="240" cy="127" r="18"/>
          <circle cx="300" cy="155" r="12"/><circle cx="354" cy="128" r="17"/><circle cx="390" cy="162" r="10"/>
          <path d="M135 174 Q170 150 200 174 T265 174" stroke="#6d472e" stroke-width="12" fill="none"/>
          <path d="M285 120 Q320 106 348 125" stroke="#6d472e" stroke-width="10" fill="none"/>
        </g>
        <g class="foam" id="foam">
          <circle cx="120" cy="120" r="18"/><circle cx="155" cy="145" r="22"/><circle cx="205" cy="125" r="18"/>
          <circle cx="250" cy="151" r="25"/><circle cx="305" cy="125" r="20"/><circle cx="350" cy="148" r="24"/><circle cx="390" cy="127" r="17"/>
        </g>
      </svg>
    </div>
    <div class="progressWrap"><div id="progress"></div></div>
  </div>

  <div class="controls">
    <div class="instruction" id="instruction">DRA FINGRET DIREKT ÖVER BILEN!</div>
    <div class="btnrow">
      <button class="action" id="washBtn">🚿 WASH</button>
      <button class="action secondary" id="boostBtn">⚡ BOOST</button>
    </div>
    <div class="toolRow">
<button class="toolBtn active" data-tool="wash">🚿 Högtryck</button>
<button class="toolBtn" data-tool="sponge">🧽 Svamp</button>
<button class="toolBtn" data-tool="shine">✨ Polish</button>
</div><div class="stageStatus" id="stageStatus">Steg 1 av 3 · Högtryck först</div>
<div class="upgrade">
      <div><div class="lvl">🧽 Wash Speed <span id="level">Lv. 1</span></div><div class="small">Snabbare tvätt = fler kunder</div></div>
      <button class="action" style="flex:0 0 auto;padding:10px 15px;font-size:14px" id="upgradeBtn">⬆️ $<span id="cost">100</span></button>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="card">
    <div class="stars">✨ ⭐ ✨</div>
    <h1>PERFECT WASH!</h1>
    <div class="reward">+$<span id="reward">100</span></div>
    <p>Din första bil är skinande ren.</p>
    <button class="action" id="continueBtn">🚗 NÄSTA BIL</button>
  </div>
</div>

<script>
let cash=Number(localStorage.cweCash||100), level=Number(localStorage.cweLevel||1), progress=0, stage=1, reward=100, washing=false;
const $=id=>document.getElementById(id);
function save(){localStorage.cweCash=Math.floor(cash);localStorage.cweLevel=level;}

// v0.3 interaction layer
let combo=0, lastTouch=0;
function fx(x,y,foam=false){
  const e=document.createElement("div");
  e.className=foam?"soapBubble":"cleanPulse";
  const size=foam?18+Math.random()*22:22+Math.random()*18;
  e.style.width=size+"px";e.style.height=size+"px";
  e.style.left=(x-size/2)+"px";e.style.top=(y-size/2)+"px";
  $("cleanFX").appendChild(e);setTimeout(()=>e.remove(),750);
}
function setCombo(){
  combo++;
  $("combo").textContent="🔥 COMBO x"+combo;
  $("combo").classList.add("show");
  clearTimeout(window.comboTimer);
  window.comboTimer=setTimeout(()=>{combo=0;$("combo").classList.remove("show")},900);
}


let selectedTool="wash";
const dirtSpots=[
  [16,38,12],[27,58,10],[39,43,14],[51,61,11],[63,42,13],[76,59,10],
  [22,73,9],[45,72,12],[68,74,10],[83,43,8]
];
function createDirt(){
  const layer=$("cleanLayer"); layer.innerHTML="";
  dirtSpots.forEach((d,i)=>{
    const s=document.createElement("div");s.className="dirtSpot";s.dataset.i=i;
    s.style.left=d[0]+"%";s.style.top=d[1]+"%";s.style.width=(d[2]*1.7)+"px";s.style.height=(d[2]*1.7)+"px";
    s.style.transform="translate(-50%,-50%)";
    layer.appendChild(s);
  });
}
function setTool(tool){
  if(!toolAllowed(tool)){ toast(tool==="sponge"?"🚿 Använd högtrycken först!":"🧽 Använd svampen först!"); return; }
  selectedTool=tool;
  const names={wash:"🚿 HÖGTRYCK",sponge:"🧽 SVAMP",shine:"✨ POLISH"};
  $("toolLabel").textContent=names[tool];
  updateTools();
}
function cleanAt(x,y){
  const r=$("cleanLayer").getBoundingClientRect();
  const lx=(x-r.left)/r.width*100, ly=(y-r.top)/r.height*100;

  document.querySelectorAll(".dirtSpot:not(.cleaning)").forEach(s=>{
    const sx=parseFloat(s.style.left), sy=parseFloat(s.style.top);
    const dist=Math.hypot((sx-lx)*r.width/100,(sy-ly)*r.height/100);
    const i=Number(s.dataset.i);

    // Only the correct tool can remove each dirt layer.
    const allowed =
      (selectedTool==="wash" && i<=6) ||
      (selectedTool==="sponge" && i>=5) ||
      (selectedTool==="shine" && i>=8);

    if(allowed && dist < (selectedTool==="wash"?42:selectedTool==="sponge"?30:22)){
      s.classList.add("cleaning");
      s.style.opacity=selectedTool==="shine"?"0":".15";
    }
  });
}
function dirtRemaining(){
  return document.querySelectorAll(".dirtSpot:not(.cleaning)").length;
}
function visibleCleanProgress(){
  const cleaned=dirtSpots.length-dirtRemaining();
  return cleaned/dirtSpots.length*100;
}


let completedStage=1;
function toolAllowed(tool){
  if(tool==="wash") return true;
  if(tool==="sponge") return completedStage>=2;
  if(tool==="shine") return completedStage>=3;
  return false;
}
function updateTools(){
  const order=["wash","sponge","shine"];
  const labels={wash:"🚿 Högtryck",sponge:"🧽 Svamp",shine:"✨ Polish"};
  document.querySelectorAll(".toolBtn").forEach(b=>{
    const t=b.dataset.tool, allowed=toolAllowed(t);
    b.classList.toggle("locked",!allowed);
    b.classList.toggle("active",t===selectedTool);
    b.textContent=(allowed?"":"🔒 ")+labels[t];
  });
  $("stageStatus").textContent =
    completedStage===1 ? "Steg 1 av 3 · 🚿 Högtryck först" :
    completedStage===2 ? "Steg 2 av 3 · 🧽 Nu är svampen upplåst" :
    "Steg 3 av 3 · ✨ Polish är upplåst";
}

function render(){
  const hints=["DRA ÖVER BILEN","LÄGG PÅ SKUM","SKÖLJ BORT SKUMMET","POLERA & SHINE"];
  $("stageHint").textContent=hints[stage-1];
  $("cash").textContent=Math.floor(cash);
  $("level").textContent="Lv. "+level;
  $("cost").textContent=Math.floor(100*Math.pow(1.65,level-1));
  $("progress").style.width=progress+"%";
  $("dirt").style.opacity=stage===4?0:Math.max(.15,1-progress/100);
  $("foam").style.opacity=stage===2||stage===3?.9:0;
  const labels=[
    ["1 / 4 · WASH","DRA FINGRET DIREKT ÖVER BILEN!"],
    ["2 / 4 · FOAM","Bra! Lägg på skum — några sekunder räcker."],
    ["3 / 4 · RINSE","Skölj bort skummet och gör bilen ren."],
    ["4 / 4 · SHINE","Sista steget! Ge bilen lite shine."]
  ];
  $("stage").textContent=labels[stage-1][0]; $("instruction").textContent=labels[stage-1][1];
}
function addProgress(n){
  $("car").classList.add("shake");
  setTimeout(()=>$("car").classList.remove("shake"),220);

  // v0.5.1: each tool has a strict stage.
  // High pressure must finish first, then sponge, then polish.
  if(stage===1 && selectedTool==="wash" && dirtRemaining()<=3){
    stage=2; progress=0; completedStage=2; selectedTool="sponge";
    toast("🧽 SVAMP UPPLÅST!"); updateTools();
  } else if(stage===2 && selectedTool==="sponge" && dirtRemaining()<=1){
    stage=3; progress=0; completedStage=3; selectedTool="shine";
    toast("✨ POLISH UPPLÅST!"); updateTools();
  } else if(stage===3 && selectedTool==="shine" && dirtRemaining()===0){
    stage=4; progress=100; complete(); return;
  }
  render();
}
function complete(){
  reward=Math.floor(100*(1+(level-1)*.25));
  cash+=reward;
  save();
  $("reward").textContent=reward;
  $("modal").style.display="flex";
  washing=false;
}
function nextCar(){
  $("modal").style.display="none"; stage=1;progress=0;render();
}
$("continueBtn").onclick=nextCar;
$("washBtn").onpointerdown=e=>{
  washing=true;
  const r=$("station").getBoundingClientRect();
  fx(r.width/2,r.height*.52,stage===2);
  addProgress(7);
};
window.onpointerup=()=>washing=false;
function touchPoint(e){
  const r=$("station").getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
$("station").addEventListener("pointerdown",e=>{
  if(e.target.closest("button")) return;
  washing=true;
  try{$("station").setPointerCapture(e.pointerId)}catch(_){}
  const p=touchPoint(e); cleanAt(p.x,p.y); fx(p.x,p.y,selectedTool==="sponge");
});
$("station").addEventListener("pointermove",e=>{
  if(!washing) return;
  e.preventDefault();
  const p=touchPoint(e);
  cleanAt(p.x,p.y);
  fx(p.x,p.y,selectedTool==="sponge");
  if(Date.now()-lastTouch>55){
    lastTouch=Date.now(); setCombo();
    const gain=selectedTool==="wash"?3.2:selectedTool==="sponge"?2.5:1.8;
    addProgress(gain);
  }
});
$("station").addEventListener("pointerup",e=>{washing=false;try{$("station").releasePointerCapture(e.pointerId)}catch(_){}});
$("station").addEventListener("pointercancel",()=>washing=false);
$("boostBtn").onclick=()=>{addProgress(25);};
$("upgradeBtn").onclick=()=>{
  const cost=100*Math.pow(1.65,level-1);
  if(cash>=cost){cash-=cost;level++;save();render();}
};
document.querySelectorAll(".toolBtn").forEach(b=>b.addEventListener("click",()=>setTool(b.dataset.tool))); updateTools();
createDirt();
render();
</script>
</body>
</html>
